name: Build

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: "recursive"

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Build
              run: |
                  corepack enable
                  yarn --no-immutable
                  yarn prisma:generate
                  yarn build

    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: "recursive"

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Lint
              run: |
                  corepack enable
                  yarn --no-immutable
                  yarn prisma:generate
                  yarn lint
